<link rel="preconnect" href="https://fonts.googleapis.com" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#EEF2FF;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;}
  input,select,button{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;}
  button:hover{opacity:0.88;}
  input:focus{border-color:#2563EB !important;}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

/* ── Design Tokens ── */
const T = {
  bg:'#EEF2FF', card:'#FFFFFF', ink:'#0F172A', sub:'#475569', muted:'#94A3B8',
  border:'rgba(15,23,42,0.08)',
  blue:'#2563EB', blueLight:'#EFF6FF',
  orange:'#F97316', orangeLight:'#FFF7ED',
  purple:'#7C3AED', purpleLight:'#F5F3FF',
  green:'#16A34A', greenLight:'#F0FDF4',
  red:'#DC2626', redLight:'#FEF2F2',
  font:"'Plus Jakarta Sans',-apple-system,sans-serif",
  r:{xs:6,sm:10,md:14,lg:18,xl:24,full:999},
  sh:{
    xs:'0 1px 2px rgba(0,0,0,0.05)',
    sm:'0 1px 4px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.06)',
    md:'0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04)',
    lg:'0 12px 40px rgba(0,0,0,0.12)',
    xl:'0 24px 80px rgba(0,0,0,0.18)',
    blue:'0 8px 24px rgba(37,99,235,0.32)',
    orange:'0 8px 24px rgba(249,115,22,0.35)',
    purple:'0 8px 24px rgba(124,58,237,0.3)',
  },
};

/* ── Primitives ── */
const Badge = ({children, color=T.blue, bg, style:st={}}) => (
  <span style={{fontFamily:T.font,fontSize:12,fontWeight:600,color,background:bg||color+'1a',padding:'3px 10px',borderRadius:T.r.full,display:'inline-flex',alignItems:'center',gap:4,whiteSpace:'nowrap',...st}}>{children}</span>
);

const Chip = ({label, active, onClick, icon}) => (
  <button onClick={onClick} style={{fontFamily:T.font,fontSize:14,fontWeight:active?600:500,color:active?'#fff':T.sub,background:active?T.blue:'#fff',border:`1.5px solid ${active?T.blue:T.border}`,borderRadius:T.r.full,padding:'7px 18px',cursor:'pointer',whiteSpace:'nowrap',display:'inline-flex',alignItems:'center',gap:6,boxShadow:active?T.sh.blue:'none',transition:'all 0.15s'}}>{icon&&<span>{icon}</span>}{label}</button>
);

const Btn = ({children, onClick, color=T.blue, outline=false, size='md', style:st={}, icon}) => {
  const pad = size==='sm'?'7px 16px':size==='lg'?'14px 32px':'11px 22px';
  const fs = size==='sm'?13:size==='lg'?17:15;
  if (outline) return (
    <button onClick={onClick} style={{fontFamily:T.font,fontSize:fs,fontWeight:600,color:T.ink,background:T.card,border:`1.5px solid ${T.border}`,borderRadius:T.r.md,padding:pad,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,boxShadow:T.sh.xs,transition:'all 0.15s',...st}}>{icon&&<span>{icon}</span>}{children}</button>
  );
  return (
    <button onClick={onClick} style={{fontFamily:T.font,fontSize:fs,fontWeight:700,color:'#fff',background:color,border:'none',borderRadius:T.r.md,padding:pad,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:8,boxShadow:`0 6px 20px ${color}44`,transition:'all 0.15s',...st}}>{icon&&<span>{icon}</span>}{children}</button>
  );
};

const Card = ({children, style:st={}, onClick, pad}) => (
  <div onClick={onClick} style={{background:T.card,borderRadius:T.r.lg,boxShadow:T.sh.sm,border:`1px solid ${T.border}`,overflow:'hidden',...(pad?{padding:pad}:{}),...st}}>{children}</div>
);

const ImgPH = ({h=200, icon='📷'}) => (
  <div style={{height:h,background:`linear-gradient(145deg,#F1F5F9,#E2E8F0)`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}>
    <span style={{fontSize:h>120?36:24,opacity:0.3}}>{icon}</span>
  </div>
);

/* ── Navigation ── */
const Nav = ({page, setPage, calcCount=0}) => (
  <div style={{position:'sticky',top:0,zIndex:200,background:'rgba(255,255,255,0.85)',backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',borderBottom:`1px solid ${T.border}`,height:64,display:'flex',alignItems:'center',padding:'0 40px',gap:20}}>
    <div onClick={()=>setPage('home')} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>

    ))}
    <div style={{flex:1}}/>
    <Btn outline size="sm" onClick={()=>setPage('calc')}>
      🧮 Смета {calcCount>0&&<Badge color={T.orange}>{calcCount}</Badge>}
    </Btn>
    <Btn size="sm" color={T.orange}>📞 Звонок</Btn>
  </div>
);

/* ── Product Card ── */
const ProductCard = ({name, price, oldPrice, tag, tagColor=T.green, onClick, onCalc, icon='📷'}) => (
  <Card onClick={onClick} style={{cursor:'pointer',transition:'transform 0.15s,box-shadow 0.15s',display:'flex',flexDirection:'column'}}>
    <ImgPH h={160} icon={icon} />
    <div style={{padding:'14px 16px 16px',display:'flex',flexDirection:'column',gap:8,flex:1}}>
      {tag&&<div><Badge color={tagColor}>{tag}</Badge></div>}
      <div style={{fontFamily:T.font,fontSize:14,fontWeight:600,color:T.ink,lineHeight:1.35,flex:1}}>{name}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:8}}>
        <span style={{fontFamily:T.font,fontSize:18,fontWeight:800,color:T.ink}}>{price}</span>
        {oldPrice&&<span style={{fontFamily:T.font,fontSize:13,color:T.muted,textDecoration:'line-through'}}>{oldPrice}</span>}
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={e=>{e.stopPropagation();onCalc&&onCalc();}} style={{flex:1,fontFamily:T.font,fontSize:13,fontWeight:700,color:'#fff',background:T.blue,border:'none',borderRadius:T.r.sm,padding:'9px 0',cursor:'pointer'}}>+ В смету</button>
        <button onClick={e=>{e.stopPropagation();onClick&&onClick();}} style={{width:36,background:T.blueLight,border:'none',borderRadius:T.r.sm,cursor:'pointer',color:T.blue,fontSize:16}}>↗</button>
      </div>
    </div>
  </Card>
);

   HOME PAGE
══════════════════════════ */

        {/* ── Categories ── */}
        <section>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:28}}>
            <h2 style={{fontFamily:T.font,fontSize:28,fontWeight:800,color:T.ink}}>Каталог оборудования</h2>
            <Btn outline size="sm" onClick={()=>setPage('catalog')}>Смотреть все →</Btn>

            <div style={{fontFamily:T.font,fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.5)',textTransform:'uppercase',letterSpacing:1,marginBottom:16}}>{col.title}</div>
            {col.items.map(item=><div key={item} style={{fontFamily:T.font,fontSize:14,color:'rgba(255,255,255,0.38)',marginBottom:10,cursor:'pointer'}}>{item}</div>)}
          </div>
        ))}
      </div>
      <div style={{borderTop:'1px solid rgba(255,255,255,0.07)',paddingTop:20,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontFamily:T.font,fontSize:13,color:'rgba(255,255,255,0.25)'}}>© 2026 ВСБ39 — Ваша Система Безопасности</span>
        <span style={{fontFamily:T.font,fontSize:12,color:'rgba(255,255,255,0.18)'}}>SEO · Sitemap · Robots.txt · vsb39.ru</span>
      </div>
    </div>
  </footer>
);

/* ── App ── */
const App = () => {
  const [page, setPage] = useState('home');
  const [calcItems, setCalcItems] = useState([]);
  const onAddToCalc = p => setCalcItems(prev=>{
    const ex = prev.find(i=>i.name===p.name);
    return ex ? prev.map(i=>i.name===p.name?{...i,qty:i.qty+1}:i) : [...prev,{...p,qty:1,id:Date.now()}];
  });
  return (
    <div style={{fontFamily:T.font,background:T.bg,minHeight:'100vh'}}>
      <Nav page={page} setPage={setPage} calcCount={calcItems.length}/>
      {page==='home'&&<HomePage setPage={setPage} onAddToCalc={onAddToCalc}/>}
      {page==='catalog'&&<CatalogPage setPage={setPage} onAddToCalc={onAddToCalc}/>}
      {page==='product'&&<ProductPage setPage={setPage} onAddToCalc={onAddToCalc}/>}
      {page==='calc'&&<CalcPage setPage={setPage}/>}
      {!['home','catalog','product','calc'].includes(page)&&(
        <div style={{maxWidth:600,margin:'80px auto',textAlign:'center',fontFamily:T.font}}>
          <div style={{fontSize:48,marginBottom:16}}>🔧</div>
          <h2 style={{fontSize:24,fontWeight:700,color:T.ink,marginBottom:8}}>Раздел в разработке</h2>
          <p style={{color:T.sub,marginBottom:24}}>Этот раздел будет добавлен в следующей версии</p>
          <Btn color={T.blue} onClick={()=>setPage('home')}>← На главную</Btn>
        </div>
      )}
      <Footer/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
