# Nginx security headers + SPA fallback
# Place in /etc/nginx/conf.d/vsb39.conf or server block

server {
    listen 443 ssl http2;
    server_name vsb39.ru www.vsb39.ru;
    root /var/www/vsb39.ru/dist;
    index index.html;

    # SSL (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/vsb39.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsb39.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru https://www.google-analytics.com https://ssl.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.vsegpt.ru https://www.google-analytics.com https://mc.yandex.ru https://region1.google-analytics.com https://region2.google-analytics.com; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name vsb39.ru www.vsb39.ru;
    return 301 https://vsb39.ru$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.vsb39.ru;
    return 301 https://vsb39.ru$request_uri;
}
